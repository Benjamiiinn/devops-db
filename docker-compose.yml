services:
  db:
    image: mysql:8.0
    container_name: innovatech_db
    restart: always
    environment:
      MYSQL_DATABASE: innovatech_ops
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

volumes:
  db_data: